# Tooling configuration for the SmartThings Local API.
#
# The project is not packaged - it ships as a Docker image built from
# requirements.txt - so this file only carries developer tool settings.
#
#   pip install -r requirements-dev.txt
#
#   black .                              format the code
#   mypy                                 check types
#   pylint main.py smartthings_ws tests  check style and common mistakes
#   pytest                               run the test suite with coverage

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=smartthings_ws --cov-report=term-missing"
# A deadlocked event loop cannot time itself out, so the suite needs an
# external timeout to fail instead of hanging.
timeout = 60
timeout_method = "signal"

[tool.coverage.run]
branch = true

[tool.mypy]
python_version = "3.13"
files = ["main.py", "smartthings_ws", "tests"]
strict = true
plugins = ["pydantic.mypy"]
# smartthings-local ships no py.typed marker; following its source is what
# lets mypy check the calls made into it.
follow_untyped_imports = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]
pretty = true
show_error_codes = true
show_column_numbers = true

[tool.pylint.main]
py-version = "3.13"
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
good-names = ["ws", "ip", "e", "f", "v"]
